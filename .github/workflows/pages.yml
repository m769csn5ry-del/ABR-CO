# Publie Orga sur GitHub Pages.
#
# `configure-pages` avec `enablement: true` active Pages et bascule la source
# sur « GitHub Actions » : aucun réglage manuel n'est nécessaire dans l'interface,
# et le dossier publié ne dépend plus d'une branche choisie à la main.
#
# L'artefact est le contenu de `todo/`, donc l'app est servie à la racine du site
# (https://<utilisateur>.github.io/ABR-CO/) et non dans un sous-dossier : c'est ce
# qui garde la portée du service worker et les chemins du manifeste corrects.

name: Publier Orga

on:
  push:
    branches: [main]
    paths:
      - 'todo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, sans annuler celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Activer Pages si ce n'est pas déjà fait
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Vérifier que le paquet est complet
        run: |
          set -euo pipefail
          for f in todo/index.html todo/manifest.webmanifest todo/sw.js \
                   todo/icons/icon-180.png todo/icons/icon-192.png \
                   todo/icons/icon-512.png todo/icons/icon-maskable-512.png; do
            [ -f "$f" ] || { echo "::error::fichier manquant : $f"; exit 1; }
          done
          grep -q 'rel="manifest"' todo/index.html \
            || { echo "::error::le manifeste n'est pas lié dans index.html"; exit 1; }
          echo "Paquet complet : $(du -sh todo | cut -f1)"

      - name: Empaqueter le dossier todo/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./todo

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
