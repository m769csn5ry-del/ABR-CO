# Netlify — le site est le dossier todo/, servi à la racine du domaine.
# Aucune étape de build : l'app est un fichier HTML autonome.
[build]
  publish = "todo"
  command = ""

# Le service worker ne doit jamais être servi depuis un cache périmé,
# sinon une mise à jour de l'app peut mettre des jours à arriver.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
