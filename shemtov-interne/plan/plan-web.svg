<svg class="plan" viewBox="150 180 680 1215" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="plan-titre plan-desc" data-vb="150 180 680 1215"><title id="plan-titre">Plan indicatif du magasin Shemtov Foch</title><desc id="plan-desc">Vue du dessus, non à l'échelle. Entrée en bas ; caisse, lait et œufs à droite en entrant ; vins et chocolat à gauche ; congélateurs et snacks au centre ; fromages et crèmerie contre le mur de gauche ; poisson, viande et charcuterie contre le mur de droite ; épicerie au fond à gauche.</desc><g class="murs"><path d="M180,200 L180,540 Q165,565 165,590 L180,1290 L600,1240"/><path d="M720,1240 L810,1210 L810,510 L790,495 L510,510 L510,250 L410,250 L340,215 L180,200"/><path d="M610,1250 L625,1345"/><path d="M720,1250 L735,1345"/><path d="M380,530 L510,530"/><path d="M510,530 L510,510"/><path d="M180,900 L335,885"/><path d="M630,825 L810,825"/></g><g class="zone" data-etape="entree"><g class="meuble k-caisse"><rect x="740" y="880" width="63" height="130" rx="6"/><text class="lbl" font-size="22" transform="rotate(-90 771.5 945.0)"><tspan x="771.5" y="952.7">CAISSE</tspan></text></g><g class="meuble k-etagere"><rect x="745" y="1060" width="58" height="135" rx="6"/><text class="lbl" font-size="18" transform="rotate(-90 774.0 1127.5)"><tspan x="774.0" y="1133.8">LAIT · ŒUFS</tspan></text></g></g><g class="zone" data-etape="vins"><g class="meuble k-etagere"><rect x="188" y="918" width="60" height="215" rx="6"/><text class="lbl" font-size="22" transform="rotate(-90 218.0 1025.5)"><tspan x="218.0" y="1033.2">VINS</tspan></text></g><g class="meuble k-etagere"><rect x="205" y="1205" width="150" height="42" rx="6"/><text class="lbl" font-size="22"><tspan x="280.0" y="1233.7">CHOCOLAT</tspan></text></g></g><g class="zone" data-etape="centre"><g class="meuble k-congelateur"><rect x="390" y="1030" width="72" height="140" rx="6"/><text class="lbl" font-size="22" transform="rotate(-90 426.0 1100.0)"><tspan x="426.0" y="1107.7">LÉGUMES</tspan></